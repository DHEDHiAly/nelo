name: Feature request
description: Propose a new capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe expected behavior and affected modules.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Offline + hardware constraints
      description: Note edge-device constraints and offline-first considerations.
