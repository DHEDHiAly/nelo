name: Bug report
description: Report a defect in current behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include input, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Device/hardware details, OS, and offline/online context.
